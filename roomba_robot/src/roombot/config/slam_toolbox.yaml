slam_toolbox:
  ros__parameters:
    use_sim_time: false
    slam_params_file: ""  # leave blank unless chaining
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    # Increase tolerance if your TF is slightly delayed
    transform_time_offset: 0.02
    tf_buffer_duration: 10.0