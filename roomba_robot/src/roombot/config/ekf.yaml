ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    reset_on_time_jump: true

    # Fuse wheel odom (position + yaw + twist x,y,yaw)
    odom0: /odom
    odom0_config: [ true, true, false,
                    false, false, true,
                    true,  true,  false,
                    false, false, true,
                    false, false ]
    odom0_queue_size: 5
    odom0_differential: false
    odom0_relative: false

    # Fuse IMU (yaw + yaw_rate). Use the published topic name from your driver:
    imu0: /bno055/imu
    imu0_config:  [ false, false, false,
                    false, false, true,
                    false, false, false,
                    false, false, true,
                    false, false, false ]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true